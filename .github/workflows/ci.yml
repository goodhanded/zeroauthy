name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # internal/federation/script's tests fail without Node 25+ (profile
      # scripts). ZA_REQUIRE_NODE is separate: it makes the customdb,
      # noderunner, actions and app tests fail rather than skip without Node.
      # 25 is deliberate: the lowest major with the network denial the
      # profile scripts rely on ("Node 25 or later"), not the newest.
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      # go test's 10-minute default is per package binary, and sqlstore and
      # grpcstore exceed it under -race: 977 s and 936 s on this runner. 50m
      # is the budget the Plan 29 record
      # (docs/superpowers/2026-10-28-plan-29-implementation-record.md) runs
      # this suite with locally (grpcstore 1160 s there).
      - run: go test -race -timeout 50m ./...
        env:
          ZA_REQUIRE_NODE: "1"
      - run: CGO_ENABLED=0 go build ./cmd/zeroauthy
      - name: generated code is up to date
        run: go generate ./... && git diff --exit-code
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: make console
      - name: the committed console build and API types are up to date
        run: git diff --exit-code -- console/dist console/src/api/schema.d.ts
  # The script runners accept Node 22.13+ (noderunner.CheckNodeVersion), where
  # the sandbox takes another path (no --allow-net, so the network stays
  # open). The test job runs Node 25 for the profile scripts, so the Node 22
  # floor gets its own run of the packages that use the runners, pinned
  # exactly. It is pinned to 22.20.0, not 22.13.0: sandboxed npm install
  # (Actions dependency builds) fails on every 22.x before 22.20.0, so the
  # declared floor does not hold for those builds yet. The package list is
  # kept by hand (internal/federation/script needs 25, so it cannot be derived
  # from noderunner's dependents): a new package that runs scripts through
  # noderunner belongs on it.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: go test -race ./internal/customdb/... ./internal/noderunner/... ./internal/actions/... ./internal/app/...
        env:
          ZA_REQUIRE_NODE: "1"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # OAuth and social profile scripts need Node 25+ (permission-enforced
      # network denial); e2e-deploy, e2e-social and e2e-email-accounts fail
      # rather than skip without it. One version for the whole job, so step
      # order never decides which lanes get it.
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: local ACME fixture runtime
        run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      - run: make e2e-domains
      - run: make e2e-deploy
      - run: make e2e-signing
      - run: make e2e-branding
      - run: make e2e-email
      - run: make e2e
      - run: make e2e-social
      - run: make e2e-email-accounts
      - run: make e2e-rbac
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: zeroauthy
        ports:
          - 55432:5432
        # Throwaway data on tmpfs, as scripts/test-sql.sh runs it: the suites
        # make thousands of small transactions and otherwise wait on fsync.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zeroauthy
        ports:
          - 53306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pzeroauthy --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Three dialects in one package binary. Measured here, 30m ran out with
      # SQLite and PostgreSQL done and MySQL 7 minutes in, before the data
      # moved to tmpfs. Service containers take no command override, so
      # test-sql.sh's fsync=off server flags are not available here.
      - run: go test -race -count=1 -timeout 60m ./internal/store/sqlstore/...
        env:
          ZA_TEST_POSTGRES_DSN: postgres://postgres:zeroauthy@127.0.0.1:55432/postgres?sslmode=disable
          ZA_TEST_MYSQL_DSN: mysql://root:zeroauthy@127.0.0.1:53306/
